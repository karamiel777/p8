  :root {
    --paper: #FAF8F4;
    --card: #FFFFFF;
    --ink: #211F1C;
    --muted: #8B8577;
    --line: #E7E2D6;
    --brass: #9C7A34;
    --brass-soft: #EFE7D2;
    --sage: #6E7F63;
    --sage-soft: #E7ECE3;
    --wine: #7A3B3B;
    --wine-soft: #F2E4E1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); }
  body { font-family: 'Inter', -apple-system, sans-serif; color: var(--ink); }
  .app { display: flex; min-height: 100vh; }
  .loading { width: 100%; display: flex; align-items: center; justify-content: center; padding: 80px 0; color: var(--muted); font-size: 14px; letter-spacing: 0.03em; }

  .sidebar { width: 232px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 28px 18px; }
  .brand { padding: 0 6px 26px; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
  .brand .mark { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 21px; font-weight: 600; letter-spacing: 0.02em; line-height: 1.25; }
  .brand .sub { font-size: 10.5px; color: var(--muted); letter-spacing: 0.14em; margin-top: 3px; }
  .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 11px; background: none; border: none; color: var(--muted); font-size: 13px; letter-spacing: 0.01em; text-align: left; border-radius: 6px; cursor: pointer; font-family: inherit; }
  .nav-item svg { flex-shrink: 0; }
  .nav-item:hover { color: var(--ink); background: var(--paper); }
  .nav-item.active { color: var(--ink); background: var(--brass-soft); font-weight: 600; }
  .lang-switch { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .lang-switch button { flex: 1; background: var(--card); border: none; padding: 7px 0; font-size: 11.5px; font-weight: 600; letter-spacing: 0.04em; color: var(--muted); cursor: pointer; font-family: inherit; }
  .lang-switch button.active { background: var(--ink); color: #fff; }
  .sidebar-foot { font-size: 10.5px; color: var(--muted); padding: 0 6px; letter-spacing: 0.02em; }
  .save-btn { display: flex; align-items: center; justify-content: center; gap: 7px; background: var(--ink); color: #fff; border: none; padding: 9px 0; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 8px; width: 100%; }
  .save-btn:hover { opacity: 0.9; }
  .save-btn[disabled] { opacity: 0.5; cursor: default; }
  .sync-status { display: flex; align-items: center; gap: 6px; font-size: 10.5px; padding: 0 6px; margin-bottom: 4px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .sync-dot.ok { background: var(--sage); }
  .sync-dot.warn { background: var(--brass); }
  .sync-dot.err { background: var(--wine); }
  .sync-dot.pending { background: var(--muted); }
  .lock-screen { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .lock-box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 36px 34px; width: 340px; max-width: 100%; text-align: center; }
  .lock-box .mark { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 24px; font-weight: 600; }
  .lock-box .sub { font-size: 10.5px; color: var(--muted); letter-spacing: 0.14em; margin-top: 3px; margin-bottom: 26px; }
  .lock-box input { text-align: center; letter-spacing: 0.08em; margin-bottom: 10px; }
  .lock-error { color: var(--wine); font-size: 12px; margin-bottom: 10px; }

  .content { flex: 1; padding: 40px 48px; max-width: 1180px; }
  .page-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; gap: 16px; flex-wrap: wrap; }
  .page-title { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 32px; font-weight: 600; margin: 0 0 5px; }
  .page-sub { color: var(--muted); font-size: 13px; margin: 0; }
  .btn { display: inline-flex; align-items: center; gap: 7px; background: var(--ink); color: #fff; border: none; padding: 10px 18px; border-radius: 5px; font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit; letter-spacing: 0.01em; white-space: nowrap; }
  .btn:hover { opacity: 0.88; }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.subtle { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn.danger { background: var(--wine); }
  .btn.small { padding: 7px 12px; font-size: 11.5px; }

  .demo-banner { background: var(--brass-soft); border: 1px solid var(--brass); border-radius: 6px; padding: 12px 16px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 30px; }
  .stat-card { background: var(--card); padding: 20px 20px; }
  .stat-value { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 600; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 7px; letter-spacing: 0.03em; text-transform: uppercase; }

  .two-col { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; align-items: start; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 22px 24px; margin-bottom: 20px; }
  .panel-title { font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; gap: 12px; }
  .row:last-child { border-bottom: none; }
  .row .tag { color: var(--muted); font-size: 11.5px; }
  .empty { color: var(--muted); font-size: 13px; font-style: italic; padding: 6px 0; }

  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .cal-month-label { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; font-weight: 600; min-width: 190px; text-align: center; }
  .cal-icon-btn { background: var(--card); border: 1px solid var(--line); border-radius: 5px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink); }
  .cal-icon-btn:hover { background: var(--paper); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .cal-dow { background: var(--card); padding: 9px 0; text-align: center; font-size: 10.5px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
  .cal-day { background: var(--card); min-height: 82px; padding: 7px; cursor: pointer; position: relative; }
  .cal-day.blank { background: var(--paper); cursor: default; }
  .cal-day.occupied { background: var(--sage-soft); }
  .cal-day.today .num { color: #fff; background: var(--ink); border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }
  .cal-day .num { font-size: 12px; color: var(--ink); }
  .cal-day .flag { font-size: 9px; margin-top: 4px; font-weight: 600; letter-spacing: 0.03em; padding: 2px 5px; border-radius: 3px; display: inline-block; }
  .cal-day .flag.arr { background: var(--sage); color: #fff; }
  .cal-day .flag.dep { background: var(--wine); color: #fff; }
  .cal-day.selected { outline: 2px solid var(--brass); outline-offset: -2px; }
  .legend { display: flex; gap: 18px; margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 12px 16px; color: var(--muted); font-weight: 600; font-size: 10.5px; letter-spacing: 0.04em; text-transform: uppercase; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .status-pill { font-size: 10.5px; font-weight: 600; letter-spacing: 0.03em; padding: 3px 9px; border-radius: 20px; text-transform: uppercase; }
  .status-Confirmed { background: var(--brass-soft); color: var(--brass); }
  .status-Checked-in { background: var(--sage-soft); color: var(--sage); }
  .status-Checked-out { background: var(--line); color: var(--muted); }
  .status-Cancelled { background: var(--wine-soft); color: var(--wine); }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 5px; border-radius: 4px; display: inline-flex; }
  .icon-btn:hover { color: var(--wine); background: var(--wine-soft); }
  .row-actions { display: flex; gap: 4px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(33,31,28,0.45); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px; }
  .modal-box { background: var(--card); border-radius: 10px; padding: 26px 28px; width: 460px; max-width: 100%; max-height: 88vh; overflow-y: auto; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .modal-head h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 600; font-size: 21px; margin: 0; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  .form-grid.single { grid-template-columns: 1fr; }
  label.field { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--muted); letter-spacing: 0.01em; }
  input, select, textarea { background: var(--paper); border: 1px solid var(--line); color: var(--ink); border-radius: 5px; padding: 9px 11px; font-size: 13.5px; outline: none; font-family: inherit; width: 100%; }
  textarea { resize: vertical; min-height: 60px; }
  input:focus, select:focus, textarea:focus { border-color: var(--brass); }
  .nights-preview { background: var(--brass-soft); border-radius: 5px; padding: 8px 11px; font-size: 12.5px; color: var(--brass); font-weight: 600; margin-bottom: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .inline-add { display: flex; gap: 8px; margin-top: 10px; }
  .inline-add input { flex: 1; }

  .month-picker { background: var(--card); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 9px 12px; font-size: 13px; outline: none; font-family: inherit; }

  .cat-bar-row { margin-bottom: 12px; }
  .cat-bar-top { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 5px; }
  .cat-bar-track { height: 7px; background: var(--paper); border-radius: 6px; overflow: hidden; }
  .cat-bar-fill { height: 100%; background: var(--brass); border-radius: 6px; }

  .summary-text { font-size: 14px; line-height: 1.65; color: var(--ink); background: var(--paper); border-radius: 8px; padding: 18px 20px; border: 1px solid var(--line); }
  .report-block-title { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--brass); margin: 26px 0 10px; }
  .report-block-title:first-child { margin-top: 0; }

  .settings-section { margin-bottom: 28px; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 6px 8px 6px 13px; font-size: 12px; }
  .chip button { background: none; border: none; color: var(--muted); cursor: pointer; display: flex; padding: 2px; }
  .chip button:hover { color: var(--wine); }

  .mobile-topbar { display: none; }

  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .mobile-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; background: var(--card); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 40;
    }
    .mobile-topbar .mark { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; font-weight: 600; }
    .hamburger-btn { background: none; border: 1px solid var(--line); border-radius: 6px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: var(--ink); flex-shrink: 0; }
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; width: 260px; max-width: 82vw;
      transform: translateX(-100%); transition: transform 0.22s ease; z-index: 61;
      box-shadow: 2px 0 24px rgba(0,0,0,0.18); overflow-y: auto;
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-scrim { position: fixed; inset: 0; background: rgba(33,31,28,0.4); z-index: 60; }
    .content { padding: 20px; }
    .two-col { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
  }

  @media print {
    body * { visibility: hidden; }
    #reportPrintArea, #reportPrintArea * { visibility: visible; }
    #reportPrintArea { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
    .no-print { display: none !important; }
  }
</style>

    if (state.syncStatus==="checking") return tr("statusSaving");
    if (state.syncStatus==="error") return tr("statusError");
    if (state.syncStatus==="conflict") return tr("statusConflict");
    if (state.dirty) return tr("statusUnsaved");
    return tr("statusSaved");
  }

  var root = document.getElementById("root");

  function showErrorBanner(msg){
    var el = document.getElementById("crashBanner");
    if (!el){
      el = document.createElement("div");
      el.id = "crashBanner";
      el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:#7A3B3B;color:#fff;padding:12px 16px;font:12px/1.5 monospace;white-space:pre-wrap;word-break:break-word;";
      document.body.appendChild(el);
    }
    el.textContent = "Erreur technique (fais une capture d'écran de ce message) : " + msg;
  }
  window.addEventListener("error", function(e){ showErrorBanner(e.message + " (" + e.filename + ":" + e.lineno + ")"); });
  window.addEventListener("unhandledrejection", function(e){ showErrorBanner("Promise: " + (e.reason && e.reason.message ? e.reason.message : e.reason)); });

    }

      renderLockScreen();

    }

    var nav = [

    else if (state.tab==="calendar") content = calendarHTML(d);

    else if (state.tab==="expenses") content = expensesHTML(d);

      '</div>' +

        '<aside class="sidebar'+(state.mobileMenuOpen?' open':'')+'">' +

          '<nav class="nav">' + navHTML + '</nav>' +

          '<button class="save-btn" data-action="save-now"'+(state.dirty||state.syncStatus==="error"?"":" disabled")+'>'+tr("sidebarSave")+'</button>' +
          '<div class="sync-status"><span class="sync-dot '+syncDotClass()+'"></span><span>'+syncStatusText()+'</span></div>' +
          '<div class="sync-status" style="margin-bottom:10px"><span>'+tr("lastModified")+' : '+fmtDateTime(d.lastModified)+'</span></div>' +

  function statCard(label, value){ return '<div class="stat-card"><div class="stat-value">'+value+'</div><div class="stat-label">'+esc(label)+'</div></div>'; }
  function rowLine(left,right,tag){ return '<div class="row"><span>'+left+(tag?' <span class="tag">'+tag+'</span>':'')+'</span><span>'+right+'</span></div>'; }

  function computeMonthStats(d, monthKey){
    var parts = monthKey.split("-"); var y = Number(parts[0]), m = Number(parts[1]);
    var daysInMonth = new Date(y, m, 0).getDate();
    var staysArriving = d.stays.filter(function(s){ return s.status!=="Cancelled" && monthKeyOf(s.arrival)===monthKey; });
    var staysDeparting = d.stays.filter(function(s){ return s.status!=="Cancelled" && monthKeyOf(s.departure)===monthKey; });
    var overlapping = d.stays.filter(function(s){ return s.status!=="Cancelled" && nightsInMonth(s,y,m-1) > 0; });
    var nightsOccupied = overlapping.reduce(function(sum,s){ return sum + nightsInMonth(s,y,m-1); },0);
    var occupancyRate = daysInMonth ? Math.min(100, Math.round((nightsOccupied/daysInMonth)*100)) : 0;
    var monthExpenses = d.expenses.filter(function(e){ return monthKeyOf(e.date)===monthKey; });
    var totalExpenses = monthExpenses.reduce(function(s,e){ return s+e.amount; },0);
    var byCategory = {};
    monthExpenses.forEach(function(e){ byCategory[e.category] = (byCategory[e.category]||0)+e.amount; });
    var highestCategory = null, highestAmt = -1;
    Object.keys(byCategory).forEach(function(c){ if (byCategory[c]>highestAmt){ highestAmt=byCategory[c]; highestCategory=c; } });
    return {
      y:y, m:m, daysInMonth:daysInMonth, staysArriving:staysArriving, staysDeparting:staysDeparting,
      staysCount: overlapping.length, nightsOccupied:nightsOccupied, occupancyRate:occupancyRate,
      monthExpenses:monthExpenses, totalExpenses:totalExpenses, byCategory:byCategory,
      highestCategory:highestCategory, highestAmt: highestAmt<0?0:highestAmt
    };
  }

  function dashboardHTML(d){
    var now = new Date();
    var monthKey = now.getFullYear()+"-"+pad2(now.getMonth()+1);
    var s = computeMonthStats(d, monthKey);
    var prevDate = new Date(now.getFullYear(), now.getMonth()-1, 1);
    var prevKey = prevDate.getFullYear()+"-"+pad2(prevDate.getMonth()+1);
    var prevStats = computeMonthStats(d, prevKey);
    var delta = prevStats.totalExpenses ? Math.round(((s.totalExpenses-prevStats.totalExpenses)/prevStats.totalExpenses)*100) : (s.totalExpenses>0?100:0);
    var deltaText = (delta>=0?"+":"") + delta + "% " + tr("vsMonth")(tr("months")[prevStats.m-1].slice(0,3));

    var upcomingArrivals = d.stays.filter(function(st){ return st.status!=="Cancelled" && st.status!=="Checked-out" && st.arrival >= todayISO(); }).sort(function(a,b){ return a.arrival<b.arrival?-1:1; }).slice(0,5);
    var upcomingDepartures = d.stays.filter(function(st){ return st.status!=="Cancelled" && st.status!=="Checked-out" && st.departure >= todayISO(); }).sort(function(a,b){ return a.departure<b.departure?-1:1; }).slice(0,5);

    var arrHTML = upcomingArrivals.length ? upcomingArrivals.map(function(st){ return rowLine(esc(st.guestName), fmtDate(st.arrival)); }).join("") : '<p class="empty">'+tr("noUpcomingArrivals")+'</p>';
    var depHTML = upcomingDepartures.length ? upcomingDepartures.map(function(st){ return rowLine(esc(st.guestName), fmtDate(st.departure)); }).join("") : '<p class="empty">'+tr("noUpcomingDepartures")+'</p>';

    return '<div class="page-head"><div><h1 class="page-title">'+tr("dash_title")+'</h1><p class="page-sub">'+fmtDate(todayISO())+'</p></div></div>' +
      '<div class="stat-grid">' +
        statCard(tr("statNightsOccupied"), s.nightsOccupied) +
        statCard(tr("statNightsAvailable"), s.daysInMonth) +
        statCard(tr("statOccupancyRate"), s.occupancyRate+"%") +
        statCard(tr("statStaysThisMonth"), s.staysCount) +
        statCard(tr("statArrivalsThisMonth"), s.staysArriving.length) +
        statCard(tr("statDeparturesThisMonth"), s.staysDeparting.length) +
      '</div>' +
      '<div class="two-col">' +
        '<div>' +
          '<div class="panel"><div class="panel-title">'+tr("monthlyOverview")+' — '+tr("months")[s.m-1]+' '+s.y+'</div>' +
            '<div class="summary-text">' + tr("dashSummary")(esc(d.residence.name), s.staysCount, s.nightsOccupied, s.occupancyRate, fmtAr(s.totalExpenses), deltaText) + '</div>' +
          '</div>' +
          '<div class="panel"><div class="panel-title">'+tr("panelExpenses")+'</div>' +
            rowLine(tr("expensesThisMonth"), fmtAr(s.totalExpenses)) +
            rowLine(tr("numberOfExpenses"), s.monthExpenses.length) +
            rowLine(tr("highestCategory"), s.highestCategory ? trCategory(s.highestCategory)+" — "+fmtAr(s.highestAmt) : "—") +
            rowLine(tr("changeVsPrevMonth"), deltaText) +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="panel"><div class="panel-title">'+tr("panelUpcomingArrivals")+'</div>' + arrHTML + '</div>' +
          '<div class="panel"><div class="panel-title">'+tr("panelUpcomingDepartures")+'</div>' + depHTML + '</div>' +
        '</div>' +
      '</div>';
  }

  function calendarHTML(d){
    var parts = state.calendarMonth.split("-"); var y = Number(parts[0]), m = Number(parts[1]);
    var firstDow = (new Date(y, m-1, 1).getDay()+6)%7;
    var daysInMonth = new Date(y, m, 0).getDate();
    var todayStr = todayISO();

    function stayOnDay(dateStr){
      return d.stays.filter(function(s){ return s.status!=="Cancelled" && dateStr>=s.arrival && dateStr<s.departure; });
    }

    var cells = "";
    for (var i=0;i<firstDow;i++) cells += '<div class="cal-day blank"></div>';
    for (var day=1; day<=daysInMonth; day++){
      var dateStr = y+"-"+pad2(m)+"-"+pad2(day);
      var occ = stayOnDay(dateStr);
      var isArr = d.stays.some(function(s){ return s.status!=="Cancelled" && s.arrival===dateStr; });
      var isDep = d.stays.some(function(s){ return s.status!=="Cancelled" && s.departure===dateStr; });
      var cls = "cal-day" + (occ.length?" occupied":"") + (dateStr===todayStr?" today":"") + (dateStr===state.selectedDay?" selected":"");
      var flags = "";
      if (isArr) flags += '<span class="flag arr">'+tr("flagArrival")+'</span> ';
      if (isDep) flags += '<span class="flag dep">'+tr("flagDeparture")+'</span>';
      cells += '<div class="'+cls+'" data-action="pick-day" data-date="'+dateStr+'"><span class="num">'+day+'</span><div>'+flags+'</div></div>';
    }

    var monthLabel = tr("months")[m-1] + " " + y;
    var detail = "";
    if (state.selectedDay){
      var dayStays = stayOnDay(state.selectedDay);
      detail = '<div class="panel"><div class="panel-title">'+fmtDate(state.selectedDay)+'</div>' +
        (dayStays.length ? dayStays.map(function(s){
          return rowLine('<strong>'+esc(s.guestName)+'</strong>', fmtDate(s.arrival)+' → '+fmtDate(s.departure), trStatus(s.status));
        }).join("") : '<p class="empty">'+tr("noStayThisDay")+'</p>') +
      '</div>';
    }

    return '<div class="page-head"><div><h1 class="page-title">'+tr("cal_title")+'</h1><p class="page-sub">'+tr("cal_sub")+'</p></div>' +
      '<button class="btn secondary small" data-action="cal-today">'+tr("today")+'</button></div>' +
      '<div class="panel">' +
        '<div class="cal-head"><button class="cal-icon-btn" data-action="cal-prev">'+ICONS.chevLeft+'</button>' +
        '<div class="cal-month-label">'+monthLabel+'</div>' +
        '<button class="cal-icon-btn" data-action="cal-next">'+ICONS.chevRight+'</button></div>' +
        '<div class="cal-grid">' + tr("dow").map(function(x){ return '<div class="cal-dow">'+x+'</div>'; }).join("") + cells + '</div>' +
        '<div class="legend"><span><i style="background:var(--sage-soft);border:1px solid var(--sage)"></i>'+tr("legendOccupied")+'</span>' +
        '<span><i style="background:var(--sage)"></i>'+tr("legendFlag")+'</span>' +
        '<span><i style="background:var(--ink)"></i>'+tr("legendToday")+'</span></div>' +
      '</div>' +
      detail;
  }

  function staysHTML(d){
    var sorted = d.stays.slice().sort(function(a,b){ return a.arrival<b.arrival?1:-1; });
    var rows = sorted.map(function(s){
      var nights = nightsBetween(s.arrival, s.departure);

  function expensesHTML(d){
    var monthKey = state.expensesMonth;
    var monthExpenses = d.expenses.filter(function(e){ return monthKeyOf(e.date)===monthKey; }).sort(function(a,b){ return a.date<b.date?1:-1; });
    var total = monthExpenses.reduce(function(s,e){ return s+e.amount; },0);

    monthExpenses.forEach(function(e){ byCategory[e.category] = (byCategory[e.category]||0)+e.amount; });
    var bars = Object.keys(byCategory).sort(function(a,b){ return byCategory[b]-byCategory[a]; }).map(function(c){

    }).join("");

    var rows = monthExpenses.map(function(e){
      return '<tr><td>'+fmtDate(e.date)+'</td><td>'+esc(e.description)+'</td><td>'+trCategory(e.category)+'</td><td>'+esc(e.supplier||"—")+'</td><td>'+fmtAr(e.amount)+'</td>' +
        '<td class="row-actions"><button class="icon-btn" data-action="edit-expense" data-id="'+e.id+'">'+ICONS.edit+'</button>' +

      '<div class="two-col">' +
        '<div class="table-wrap"><table><thead><tr><th>'+tr("thDate")+'</th><th>'+tr("thDescription")+'</th><th>'+tr("thCategory")+'</th><th>'+tr("thSupplier")+'</th><th>'+tr("thAmount")+'</th><th></th></tr></thead><tbody>' +

        '</tbody></table></div>' +
        '<div>' +
          '<div class="panel"><div class="panel-title">'+tr("totalMonthlyExpenses")+'</div><div class="stat-value">'+fmtAr(total)+'</div></div>' +
          '<div class="panel"><div class="panel-title">'+tr("byCategory")+'</div>' + (bars || '<p class="empty">'+tr("noDataYet")+'</p>') + '</div>' +
        '</div>' +
      '</div>';
  }

  function settingsHTML(d){
    var catChips = d.categories.map(function(c){ return '<span class="chip">'+trCategory(c)+'<button data-action="remove-category" data-cat="'+esc(c)+'">'+ICONS.x+'</button></span>'; }).join("");
    var syncPanel;
    if (state.ghToken){
      syncPanel = '<div class="settings-section panel"><div class="panel-title">'+tr("syncSection")+'</div>' +
        '<div class="row"><span><span class="sync-dot '+syncDotClass()+'" style="display:inline-block;margin-right:8px"></span>'+tr("syncConnected")+' — '+esc(state.ghOwner)+'/'+esc(state.ghRepo)+'</span></div>' +
        '<div class="row"><span>'+tr("lastModified")+'</span><span>'+fmtDateTime(d.lastModified)+'</span></div>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">' +
          '<button class="btn secondary small" data-action="gh-reload">'+tr("syncReload")+'</button>' +
          '<button class="btn subtle small" data-action="gh-disconnect">'+tr("syncDisconnect")+'</button>' +
        '</div>' +
      '</div>';
    } else {
      syncPanel = '<div class="settings-section panel"><div class="panel-title">'+tr("syncSection")+'</div>' +
        '<p class="empty" style="margin-bottom:12px">'+tr("syncDesc")+' '+tr("syncNotConnected")+'</p>' +
        '<div class="form-grid">' +
          '<label class="field">'+tr("syncOwner")+'<input type="text" id="syncOwnerInput" value="'+esc(state.ghOwner)+'" /></label>' +
          '<label class="field">'+tr("syncRepo")+'<input type="text" id="syncRepoInput" value="'+esc(state.ghRepo)+'" /></label>' +
        '</div>' +
        '<div class="form-grid single"><label class="field">'+tr("syncToken")+'<input type="password" id="syncTokenInput" placeholder="github_pat_…" /></label></div>' +
        '<button class="btn small" data-action="gh-connect">'+tr("syncConnect")+'</button>' +
        '<p class="empty" style="margin-top:14px"><strong>'+tr("syncHowTitle")+'</strong><br/>'+tr("syncHowBody")+'</p>' +
      '</div>';
    }

    var pwPanel;
    if (d.accessPasswordHash){
      pwPanel = '<div class="settings-section panel"><div class="panel-title">'+tr("pwSection")+'</div>' +
        '<p class="empty" style="margin-bottom:12px">'+tr("pwEnabledDesc")+'</p>' +
        '<div class="form-grid">' +
          '<label class="field">'+tr("pwNew")+'<input type="password" id="pwNewInput" /></label>' +
          '<label class="field">'+tr("pwConfirm")+'<input type="password" id="pwConfirmInput" /></label>' +
        '</div>' +
        (state.pwError ? '<p class="lock-error">'+esc(state.pwError)+'</p>' : '') +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn secondary small" data-action="pw-set">'+tr("pwChange")+'</button>' +
          '<button class="btn danger small" data-action="pw-remove">'+tr("pwRemove")+'</button>' +
        '</div>' +
        '<p class="empty" style="margin-top:12px">'+tr("pwWarning")+'</p>' +
      '</div>';
    } else {
      pwPanel = '<div class="settings-section panel"><div class="panel-title">'+tr("pwSection")+'</div>' +
        '<p class="empty" style="margin-bottom:12px">'+tr("pwDisabledDesc")+'</p>' +
        '<div class="form-grid">' +
          '<label class="field">'+tr("pwNew")+'<input type="password" id="pwNewInput" /></label>' +
          '<label class="field">'+tr("pwConfirm")+'<input type="password" id="pwConfirmInput" /></label>' +
        '</div>' +
        (state.pwError ? '<p class="lock-error">'+esc(state.pwError)+'</p>' : '') +
        '<button class="btn small" data-action="pw-set">'+tr("pwSet")+'</button>' +
        '<p class="empty" style="margin-top:12px">'+tr("pwWarning")+'</p>' +
      '</div>';
    }
    return '<div class="page-head"><div><h1 class="page-title">'+tr("set_title")+'</h1><p class="page-sub">'+tr("set_sub")+'</p></div></div>' +
      syncPanel + pwPanel +
      '<div class="settings-section panel"><div class="panel-title">'+tr("residence")+'</div>' +
        '<div class="form-grid">' +
          '<label class="field">'+tr("name")+'<input type="text" id="settName" value="'+esc(d.residence.name)+'" /></label>' +
          '<label class="field">'+tr("subtitle")+'<input type="text" id="settSubtitle" value="'+esc(d.residence.subtitle||"")+'" /></label>' +
        '</div>' +
        '<button class="btn secondary small" data-action="save-residence">'+tr("save")+'</button>' +
      '</div>' +
      '<div class="settings-section panel"><div class="panel-title">'+tr("expenseCategories")+'</div>' +
        '<div class="chip-list">'+catChips+'</div>' +
        '<form class="inline-add" data-form="category"><input type="text" name="cat" placeholder="'+tr("newCategoryName")+'" required />' +
        '<button class="btn secondary small" type="submit">'+ICONS.plus+' '+tr("add")+'</button></form>' +
      '</div>' +
      '<div class="settings-section panel"><div class="panel-title">'+tr("dataSection")+'</div>' +
        '<p class="empty" style="margin-bottom:12px">'+tr("dataDesc")+'</p>' +
        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<button class="btn secondary small" data-action="export-data">'+ICONS.download+' '+tr("exportData")+'</button>' +
          '<label class="btn secondary small" style="cursor:pointer">'+ICONS.upload+' '+tr("importData")+'<input type="file" id="importFile" accept="application/json" style="display:none" /></label>' +
          '<button class="btn danger small" data-action="clear-demo">'+tr("removeDemoData")+'</button>' +
        '</div>' +
      '</div>';
  }

  function modalHTML(d){
    if (state.modal.type==="stay"){
      var editing = state.modal.editId ? d.stays.find(function(s){ return s.id===state.modal.editId; }) : null;
      var srcOpts = BOOKING_SOURCES.map(function(o){ return '<option value="'+o+'"'+(editing&&editing.source===o?' selected':'')+'>'+trSource(o)+'</option>'; }).join("");
      var statOpts = STAY_STATUSES.map(function(o){ return '<option value="'+o+'"'+(editing&&editing.status===o?' selected':'')+'>'+trStatus(o)+'</option>'; }).join("");
      var arr = editing?editing.arrival:todayISO();
      var dep = editing?editing.departure:todayISO();
      return '<div class="modal-overlay" id="modalOverlay"><div class="modal-box">' +
        '<div class="modal-head"><h3>'+(editing?tr("modalEditStay"):tr("modalAddStay"))+'</h3><button class="icon-btn" id="modalClose">'+ICONS.x+'</button></div>' +
        '<form id="stayForm" data-form="stay">' +
          '<input type="hidden" name="id" value="'+(editing?editing.id:"")+'" />' +
          '<div class="form-grid single"><label class="field">'+tr("guestName")+'<input type="text" name="guestName" value="'+(editing?esc(editing.guestName):"")+'" required /></label></div>' +
          '<div class="form-grid">' +
            '<label class="field">'+tr("arrivalDate")+'<input type="date" name="arrival" id="stayArrival" value="'+arr+'" required /></label>' +
            '<label class="field">'+tr("departureDate")+'<input type="date" name="departure" id="stayDeparture" value="'+dep+'" required /></label>' +
          '</div>' +
          '<div id="nightsPreview" class="nights-preview">'+tr("nights")(nightsBetween(arr,dep))+'</div>' +
          '<div class="form-grid">' +
            '<label class="field">'+tr("numberOfGuests")+'<input type="number" name="guests" min="1" value="'+(editing?editing.guests:1)+'" required /></label>' +
            '<label class="field">'+tr("bookingSource")+'<select name="source">'+srcOpts+'</select></label>' +
          '</div>' +
          '<div class="form-grid"><label class="field">'+tr("status")+'<select name="status">'+statOpts+'</select></label></div>' +
          '<div class="form-grid single"><label class="field">'+tr("notes")+'<textarea name="notes">'+(editing?esc(editing.notes||""):"")+'</textarea></label></div>' +
          '<div class="modal-actions"><button type="button" class="btn secondary" id="modalCancel">'+tr("cancel")+'</button><button type="submit" class="btn">'+(editing?tr("saveChanges"):tr("addStay"))+'</button></div>' +
        '</form>' +
      '</div></div>';
    }
    if (state.modal.type==="expense"){
      var e = state.modal.editId ? d.expenses.find(function(x){ return x.id===state.modal.editId; }) : null;
      var catOpts = d.categories.map(function(c){ return '<option value="'+esc(c)+'"'+(e&&e.category===c?' selected':'')+'>'+trCategory(c)+'</option>'; }).join("");
      var payOpts = PAYMENT_METHODS.map(function(p){ return '<option value="'+p+'"'+(e&&e.paymentMethod===p?' selected':'')+'>'+trPayment(p)+'</option>'; }).join("");
      return '<div class="modal-overlay" id="modalOverlay"><div class="modal-box">' +
        '<div class="modal-head"><h3>'+(e?tr("modalEditExpense"):tr("modalAddExpense"))+'</h3><button class="icon-btn" id="modalClose">'+ICONS.x+'</button></div>' +
        '<form id="expenseForm" data-form="expense">' +
          '<input type="hidden" name="id" value="'+(e?e.id:"")+'" />' +
          '<div class="form-grid">' +
            '<label class="field">'+tr("thDate")+'<input type="date" name="date" value="'+(e?e.date:todayISO())+'" required /></label>' +
            '<label class="field">'+tr("amountAr")+'<input type="number" name="amount" min="0" value="'+(e?e.amount:"")+'" required /></label>' +
          '</div>' +
          '<div class="form-grid single"><label class="field">'+tr("description")+'<input type="text" name="description" value="'+(e?esc(e.description):"")+'" required /></label></div>' +
          '<div class="form-grid">' +
            '<label class="field">'+tr("category")+'<select name="category">'+catOpts+'</select></label>' +
            '<label class="field">'+tr("paymentMethod")+'<select name="paymentMethod">'+payOpts+'</select></label>' +
          '</div>' +
          '<div class="form-grid single"><label class="field">'+tr("supplier")+'<input type="text" name="supplier" value="'+(e?esc(e.supplier||""):"")+'" /></label></div>' +
          '<div class="form-grid single"><label class="field">'+tr("notes")+'<textarea name="notes">'+(e?esc(e.notes||""):"")+'</textarea></label></div>' +
          '<div class="modal-actions"><button type="button" class="btn secondary" id="modalCancel">'+tr("cancel")+'</button><button type="submit" class="btn">'+(e?tr("saveChanges"):tr("addExpense"))+'</button></div>' +
        '</form>' +
      '</div></div>';
    }
    return "";
  }
  function bindModal(d){
    var overlay = document.getElementById("modalOverlay");
    overlay.addEventListener("click", function(e2){ if(e2.target.id==="modalOverlay") closeModal(); });
    document.getElementById("modalClose").addEventListener("click", closeModal);
    var cancelBtn = document.getElementById("modalCancel");
    if (cancelBtn) cancelBtn.addEventListener("click", closeModal);

    if (state.modal.type==="stay"){
      var arrEl = document.getElementById("stayArrival"), depEl = document.getElementById("stayDeparture");
      function updatePreview(){ document.getElementById("nightsPreview").textContent = tr("nights")(nightsBetween(arrEl.value, depEl.value)); }
      arrEl.addEventListener("change", updatePreview);
      depEl.addEventListener("change", updatePreview);
    }
  }
  function closeModal(){ state.modal = null; render(); }

  function renderLockScreen(){
    var d = state.data;
    root.innerHTML = '<div class="lock-screen"><div class="lock-box">' +
      '<div class="mark">'+esc(d.residence.name)+'</div><div class="sub">'+esc((d.residence.subtitle||"").toUpperCase())+'</div>' +
      '<form id="lockForm">' +
        '<input type="password" id="lockInput" placeholder="'+tr("lockPlaceholder")+'" autofocus />' +
        (state.lockError ? '<div class="lock-error">'+tr("lockWrong")+'</div>' : '') +
        '<button class="btn" type="submit" style="width:100%;justify-content:center">'+tr("lockButton")+'</button>' +
      '</form>' +
    '</div></div>';
    document.getElementById("lockForm").addEventListener("submit", function(e){
      e.preventDefault();
      var val = document.getElementById("lockInput").value;
      sha256Hex(val).then(function(hash){
        if (hash === state.data.accessPasswordHash){
          try { localStorage.setItem(UNLOCK_KEY, hash); } catch(err){}
          state.locked = false; state.lockError = false; render();
        } else {
          state.lockError = true; render();
        }
      });
    });
  }

  function confirmHTML(){
    return '<div class="modal-overlay" id="confirmOverlay"><div class="modal-box" style="width:340px">' +
      '<div class="modal-head"><h3>'+tr("confirmDeleteTitle")+'</h3></div>' +
      '<p class="empty" style="margin-bottom:16px">'+tr("confirmDeleteBody")+'</p>' +
      '<div class="modal-actions"><button class="btn secondary" id="confirmCancel">'+tr("cancel")+'</button><button class="btn danger" id="confirmOk">'+tr("delete")+'</button></div>' +
    '</div></div>';
  }
  function bindConfirm(){
    document.getElementById("confirmCancel").addEventListener("click", function(){ state.confirmAction=null; render(); });
    document.getElementById("confirmOk").addEventListener("click", function(){
      var action = state.confirmAction;
      state.confirmAction = null;
      if (action.type==="delete-stay") update({ stays: state.data.stays.filter(function(s){ return s.id!==action.id; }) });
      else if (action.type==="delete-expense") update({ expenses: state.data.expenses.filter(function(e){ return e.id!==action.id; }) });
      else render();
    });
  }

  root.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    var d = state.data;
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if (action==="tab"){ state.tab = el.getAttribute("data-tab"); state.selectedDay=null; state.mobileMenuOpen=false; render(); }
    else if (action==="toggle-menu"){ state.mobileMenuOpen = !state.mobileMenuOpen; render(); }
    else if (action==="lang"){ state.lang = el.getAttribute("data-lang"); saveLang(); render(); }
    else if (action==="save-now"){ doRemoteSave(); }
    else if (action==="gh-connect"){
      var owner = document.getElementById("syncOwnerInput").value.trim();
      var repo = document.getElementById("syncRepoInput").value.trim();
      var token = document.getElementById("syncTokenInput").value.trim();
      if (!token) return;
      ghConnect(owner, repo, token);
    }
    else if (action==="gh-disconnect"){ ghDisconnect(); }
    else if (action==="gh-reload"){ ghReloadLatest(); }
    else if (action==="pw-set"){
      var pw1 = document.getElementById("pwNewInput").value;
      var pw2 = document.getElementById("pwConfirmInput").value;
      if (pw1.length < 4){ state.pwError = tr("pwTooShort"); render(); return; }
      if (pw1 !== pw2){ state.pwError = tr("pwMismatch"); render(); return; }
      sha256Hex(pw1).then(function(hash){
        state.pwError = null;
        try { localStorage.setItem(UNLOCK_KEY, hash); } catch(err){}
        update({ accessPasswordHash: hash });
      });
    }
    else if (action==="pw-remove"){
      state.pwError = null;
      try { localStorage.removeItem(UNLOCK_KEY); } catch(err){}
      update({ accessPasswordHash: null });
    }
    else if (action==="cal-prev"){ var p=state.calendarMonth.split("-"); var dt=new Date(Number(p[0]),Number(p[1])-2,1); state.calendarMonth=dt.getFullYear()+"-"+pad2(dt.getMonth()+1); render(); }
    else if (action==="cal-next"){ var p2=state.calendarMonth.split("-"); var dt2=new Date(Number(p2[0]),Number(p2[1]),1); state.calendarMonth=dt2.getFullYear()+"-"+pad2(dt2.getMonth()+1); render(); }
    else if (action==="cal-today"){ state.calendarMonth = todayISO().slice(0,7); state.selectedDay = todayISO(); render(); }
    else if (action==="pick-day"){ state.selectedDay = el.getAttribute("data-date"); render(); }
    else if (action==="new-stay"){ state.modal = { type:"stay", editId:null }; render(); }
    else if (action==="edit-stay"){ state.modal = { type:"stay", editId:id }; render(); }
    else if (action==="ask-delete-stay"){ state.confirmAction = { type:"delete-stay", id:id }; render(); }
    else if (action==="new-expense"){ state.modal = { type:"expense", editId:null }; render(); }
    else if (action==="edit-expense"){ state.modal = { type:"expense", editId:id }; render(); }
    else if (action==="ask-delete-expense"){ state.confirmAction = { type:"delete-expense", id:id }; render(); }
    else if (action==="open-report"){ state.reportMonth = el.getAttribute("data-month"); state.tab="reports"; render(); }
    else if (action==="print-report"){ window.print(); }
    else if (action==="clear-demo"){
      update({ stays: d.stays.filter(function(s){ return !s.isDemo; }), expenses: d.expenses.filter(function(e){ return !e.isDemo; }) });
    }
    else if (action==="save-residence"){
      var name = document.getElementById("settName").value.trim() || d.residence.name;
      var sub = document.getElementById("settSubtitle").value.trim();
      update({ residence: { name:name, subtitle:sub } });
    }
    else if (action==="remove-category"){
      var cat = el.getAttribute("data-cat");
      update({ categories: d.categories.filter(function(c){ return c!==cat; }) });
    }
    else if (action==="export-data"){
      var blob = new Blob([JSON.stringify(d,null,2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "masoandro-p8-backup-"+todayISO()+".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  });

  root.addEventListener("change", function(e){
    var el = e.target;
    if (el.id==="reportMonthInput"){ state.reportMonth = el.value; render(); }
    else if (el.id==="expMonthInput"){ state.expensesMonth = el.value; render(); }
    else if (el.id==="importFile"){
      var file = el.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try {
          var parsed = JSON.parse(reader.result);
          if (!parsed.stays || !parsed.expenses) throw new Error("invalid");
          state.data = fillDefaults(parsed);
          state.data.lastModified = new Date().toISOString();
          state.dirty = true;
          saveLocalOnly(); render();
          scheduleRemoteSave();
        } catch(err){ alert(tr("importInvalid")); }
      };
      reader.readAsText(file);
    }
    else if (el.id==="reportNotes"){
      var notes = Object.assign({}, state.data.monthlyNotes);
      notes[state.reportMonth] = el.value;
      update({ monthlyNotes: notes });
    }
  });

  root.addEventListener("submit", function(e){
    var form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    var type = form.getAttribute("data-form");
    var d = state.data;
    var fd = new FormData(form);

    if (type==="stay"){
      var id = fd.get("id");
      var payload = {
        guestName: fd.get("guestName"), arrival: fd.get("arrival"), departure: fd.get("departure"),
        guests: Number(fd.get("guests"))||1, source: fd.get("source"), status: fd.get("status"), notes: fd.get("notes")
      };
      if (id){
        update({ stays: d.stays.map(function(s){ return s.id===id ? Object.assign({},s,payload) : s; }) });
      } else {
        update({ stays: [Object.assign({id:uid(), isDemo:false}, payload)].concat(d.stays) });
      }
      state.modal = null; render();
    }
    else if (type==="expense"){
      var eid = fd.get("id");
      var payload2 = {
        date: fd.get("date"), amount: Number(fd.get("amount"))||0, description: fd.get("description"),
        category: fd.get("category"), paymentMethod: fd.get("paymentMethod"), supplier: fd.get("supplier"), notes: fd.get("notes")
      };
      if (eid){
        update({ expenses: d.expenses.map(function(e2){ return e2.id===eid ? Object.assign({},e2,payload2) : e2; }) });
      } else {
        update({ expenses: [Object.assign({id:uid(), isDemo:false}, payload2)].concat(d.expenses) });
      }
      state.modal = null; render();
    }
    else if (type==="category"){
      var cat = (fd.get("cat")||"").trim();
      if (cat && d.categories.indexOf(cat)===-1) update({ categories: d.categories.concat([cat]) });
      form.reset();
    }
  });

  window.addEventListener("pageshow", function(e){
    if (e.persisted){ window.location.reload(); }
  });

  loadData();
})();
</script>
</body>
</html>
